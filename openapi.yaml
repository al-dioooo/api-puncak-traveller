openapi: 3.1.0
info:
  title: Puncak Traveller API
  version: 0.1.0
  description: REST API for Puncak Travellers website, mobile app, bookings, and content.
servers:
  - url: https://api-puncak-traveller.test
    description: Local Laravel Herd
  - url: http://localhost
    description: Local development fallback
tags:
  - name: Health
  - name: Landing
  - name: Communities
  - name: Events
  - name: Places
  - name: Galleries
  - name: Contact
  - name: Account
  - name: Bookings
paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getApiHealth
      summary: Get API health status.
      responses:
        "200":
          description: API is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/landing:
    get:
      tags: [Landing]
      operationId: getLandingPage
      summary: Get landing page content and metrics.
      responses:
        "200":
          description: Landing page payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingResponse"
  /api/v1/communities:
    get:
      tags: [Communities]
      operationId: listCommunities
      summary: List root communities with sub-communities.
      parameters:
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated community list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Community"
  /api/v1/communities/{community}:
    get:
      tags: [Communities]
      operationId: getCommunity
      summary: Get a community by slug.
      parameters:
        - $ref: "#/components/parameters/CommunitySlug"
      responses:
        "200":
          description: Community detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Community"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events, optionally filtered by derived status and community slug.
      parameters:
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [past, ongoing, upcoming]
          example: upcoming
        - name: community
          in: query
          required: false
          schema:
            type: string
          example: puncak-runners
      responses:
        "200":
          description: Paginated event list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/EventSummary"
  /api/v1/events/{event}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get an event by slug with ticket types.
      parameters:
        - $ref: "#/components/parameters/EventSlug"
      responses:
        "200":
          description: Event detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/places:
    get:
      tags: [Places]
      operationId: listPlaces
      summary: List places for map and list views.
      parameters:
        - $ref: "#/components/parameters/PerPage"
        - name: community
          in: query
          required: false
          schema:
            type: string
          example: puncak-travellers
      responses:
        "200":
          description: Paginated place list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Place"
  /api/v1/places/{place}:
    get:
      tags: [Places]
      operationId: getPlace
      summary: Get a place by ID.
      parameters:
        - $ref: "#/components/parameters/PlaceId"
      responses:
        "200":
          description: Place detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Place"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/galleries:
    get:
      tags: [Galleries]
      operationId: listGalleries
      summary: List gallery media.
      parameters:
        - $ref: "#/components/parameters/PerPage"
        - name: community
          in: query
          required: false
          schema:
            type: string
          example: puncak-travellers
        - name: event
          in: query
          required: false
          schema:
            type: string
          example: morning-run
      responses:
        "200":
          description: Paginated gallery list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Gallery"
  /api/v1/galleries/{gallery}:
    get:
      tags: [Galleries]
      operationId: getGallery
      summary: Get a gallery item by ID.
      parameters:
        - $ref: "#/components/parameters/GalleryId"
      responses:
        "200":
          description: Gallery item detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Gallery"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/contact:
    post:
      tags: [Contact]
      operationId: createContactMessage
      summary: Submit a public contact message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageRequest"
      responses:
        "201":
          description: Message received.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/me:
    get:
      tags: [Account]
      operationId: getCurrentUser
      summary: Get the authenticated user's profile.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/bookings:
    get:
      tags: [Bookings]
      operationId: listBookings
      summary: List bookings for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paginated booking list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/bookings/{booking}:
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Get one booking owned by the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Booking detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events/{event}/bookings:
    post:
      tags: [Bookings]
      operationId: createEventBooking
      summary: Create an idempotent booking for an event.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EventSlug"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          example: booking-run-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 15
    CommunitySlug:
      name: community
      in: path
      required: true
      schema:
        type: string
      example: puncak-runners
    EventSlug:
      name: event
      in: path
      required: true
      schema:
        type: string
      example: morning-run
    PlaceId:
      name: place
      in: path
      required: true
      schema:
        type: integer
      example: 1
    GalleryId:
      name: gallery
      in: path
      required: true
      schema:
        type: integer
      example: 1
    BookingId:
      name: booking
      in: path
      required: true
      schema:
        type: integer
      example: 1
  responses:
    Unauthenticated:
      description: The request is missing valid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: Unauthenticated.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: Not Found
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, service]
          properties:
            status:
              type: string
              example: ok
            service:
              type: string
              example: Puncak Traveller
    PaginatedResponse:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: {}
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PaginationLinks:
      type: object
      properties:
        first:
          type: [string, "null"]
          format: uri
        last:
          type: [string, "null"]
          format: uri
        prev:
          type: [string, "null"]
          format: uri
        next:
          type: [string, "null"]
          format: uri
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: [integer, "null"]
        last_page:
          type: integer
        links:
          type: array
          items:
            type: object
        path:
          type: string
        per_page:
          type: integer
        to:
          type: [integer, "null"]
        total:
          type: integer
    LandingResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [hero_stats, upcoming_events, activities, live_event, communities, gallery]
          properties:
            hero_stats:
              type: array
              items:
                $ref: "#/components/schemas/LandingStat"
            upcoming_events:
              type: array
              items:
                $ref: "#/components/schemas/EventSummary"
            activities:
              type: array
              items:
                $ref: "#/components/schemas/LandingActivity"
            live_event:
              anyOf:
                - $ref: "#/components/schemas/EventSummary"
                - type: "null"
            communities:
              type: array
              items:
                $ref: "#/components/schemas/Community"
            gallery:
              type: array
              items:
                $ref: "#/components/schemas/Gallery"
    LandingStat:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
          example: Active members
        value:
          type: integer
          minimum: 0
          example: 18000
    LandingActivity:
      type: object
      required: [activity_type, activity_label, upcoming_count]
      properties:
        activity_type:
          type: string
          enum: [trail_run, healthy_walk, camping, wellness]
        activity_label:
          type: string
          example: Trail Run
        upcoming_count:
          type: integer
          minimum: 0
    Community:
      type: object
      required: [id, parent_id, name, slug, description, image_path, image_url, member_count, children]
      properties:
        id:
          type: integer
        parent_id:
          type: [integer, "null"]
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, "null"]
        image_path:
          type: [string, "null"]
          example: communities/puncak-runners.jpg
        image_url:
          type: [string, "null"]
          format: uri
          example: http://api-puncak-traveller.test/storage/communities/puncak-runners.jpg
        member_count:
          type: integer
          minimum: 0
        children:
          type: array
          items:
            $ref: "#/components/schemas/Community"
    Place:
      type: object
      required: [id, community_id, name, lat, lng, description]
      properties:
        id:
          type: integer
        community_id:
          type: integer
        name:
          type: string
        lat:
          type: number
          format: float
        lng:
          type: number
          format: float
        description:
          type: [string, "null"]
        community:
          $ref: "#/components/schemas/Community"
    TicketType:
      type: object
      required: [id, event_id, name, price, quantity, sold, remaining]
      properties:
        id:
          type: integer
        event_id:
          type: integer
        name:
          type: string
        price:
          type: integer
          minimum: 0
        quantity:
          type: integer
          minimum: 0
        sold:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
    EventSummary:
      type: object
      required: [id, community_id, place_id, title, slug, description, activity_type, activity_label, distance_label, status, starts_at, ends_at, starting_price, cover_image, cover_image_url]
      properties:
        id:
          type: integer
        community_id:
          type: integer
        place_id:
          type: [integer, "null"]
        title:
          type: string
        slug:
          type: string
        description:
          type: [string, "null"]
        activity_type:
          type: string
          enum: [trail_run, healthy_walk, camping, wellness]
        activity_label:
          type: string
          example: Trail Run
        distance_label:
          type: [string, "null"]
          example: 10K
        status:
          type: string
          enum: [past, ongoing, upcoming]
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        starting_price:
          type: [integer, "null"]
          minimum: 0
        cover_image:
          type: [string, "null"]
          example: events/puncak-trail-run.jpg
        cover_image_url:
          type: [string, "null"]
          format: uri
          example: http://api-puncak-traveller.test/storage/events/puncak-trail-run.jpg
        participant_count:
          type: integer
          minimum: 0
        community:
          $ref: "#/components/schemas/Community"
        place:
          $ref: "#/components/schemas/Place"
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          required: [ticket_types]
          properties:
            ticket_types:
              type: array
              items:
                $ref: "#/components/schemas/TicketType"
    Gallery:
      type: object
      required: [id, community_id, event_id, image_path, image_url, caption]
      properties:
        id:
          type: integer
        community_id:
          type: integer
        event_id:
          type: [integer, "null"]
        image_path:
          type: string
          example: galleries/morning-climb.jpg
        image_url:
          type: string
          format: uri
          example: http://api-puncak-traveller.test/storage/galleries/morning-climb.jpg
        caption:
          type: [string, "null"]
        community:
          $ref: "#/components/schemas/Community"
        event:
          $ref: "#/components/schemas/EventSummary"
    ContactMessageRequest:
      type: object
      required: [name, email, message]
      properties:
        name:
          type: string
          maxLength: 255
          example: Alice Example
        email:
          type: string
          format: email
          maxLength: 255
          example: alice@example.com
        message:
          type: string
          maxLength: 5000
          example: I want to know more about the next event.
    ContactMessageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status]
          properties:
            id:
              type: integer
            status:
              type: string
              example: received
    User:
      type: object
      required: [id, name, email, role, avatar]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [member, admin]
        avatar:
          type: [string, "null"]
    BookingItem:
      type: object
      required: [id, ticket_type_id, quantity, unit_price]
      properties:
        id:
          type: integer
        ticket_type_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: integer
          minimum: 0
        ticket_type:
          $ref: "#/components/schemas/TicketType"
    Booking:
      type: object
      required: [id, event_id, reference, status, total, created_at, items]
      properties:
        id:
          type: integer
        event_id:
          type: integer
        reference:
          type: string
          example: PT-20260602-ABCDEFGH
        status:
          type: string
          enum: [reserved, cancelled]
        total:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        event:
          $ref: "#/components/schemas/EventSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookingItem"
    CreateBookingRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [ticket_type_id, quantity]
            properties:
              ticket_type_id:
                type: integer
                example: 1
              quantity:
                type: integer
                minimum: 1
                maximum: 10
                example: 2
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ValidationErrorResponse:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
