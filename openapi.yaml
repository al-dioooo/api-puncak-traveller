openapi: 3.0.3
info:
  title: Puncak Traveller API
  version: 0.2.0
  description: REST API for Puncak Travellers website, mobile app, bookings, payments,
    and admin content management.
servers:
- url: https://api-puncak-traveller.test
  description: Local Laravel Herd
- url: http://localhost
  description: Local development fallback
security: []
tags:
- name: Health
- name: Landing
- name: Auth
- name: Communities
- name: Events
- name: Places
- name: Galleries
- name: Contact
- name: Account
- name: Bookings
- name: Payments
- name: Admin
paths:
  "/api/v1/health":
    get:
      tags:
      - Health
      operationId: getApiHealth
      summary: Get API health status.
      responses:
        '200':
          description: API is reachable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HealthResponse"
  "/api/v1/landing":
    get:
      tags:
      - Landing
      operationId: getLandingPage
      summary: Get landing page content and metrics.
      responses:
        '200':
          description: Landing page payload.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LandingResponse"
  "/api/v1/auth/google/redirect":
    get:
      tags:
      - Auth
      operationId: redirectToGoogle
      summary: Start Google OAuth sign-in.
      parameters:
      - name: return_to
        in: query
        required: false
        schema:
          type: string
          default: "/account"
        example: "/account"
      responses:
        '302':
          description: Redirects to Google OAuth.
          headers:
            Location:
              schema:
                type: string
                format: uri
  "/api/v1/auth/google/callback":
    get:
      tags:
      - Auth
      operationId: handleGoogleCallback
      summary: Handle Google OAuth callback for web clients.
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: code
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: Redirects to the frontend callback with a one-time exchange
            code.
          headers:
            Location:
              schema:
                type: string
                format: uri
  "/api/v1/auth/mobile/google/callback":
    get:
      tags:
      - Auth
      operationId: handleMobileGoogleCallback
      summary: Handle Google OAuth callback for mobile deep-link clients.
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: code
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: Redirects to the configured mobile callback with a one-time
            exchange code.
          headers:
            Location:
              schema:
                type: string
                format: uri
  "/api/v1/auth/register":
    post:
      tags:
      - Auth
      operationId: register
      summary: Create a member account and issue a Sanctum token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthSessionResponse"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/auth/login":
    post:
      tags:
      - Auth
      operationId: login
      summary: Sign in with email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: Signed in successfully.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthSessionResponse"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          description: Too many login attempts.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/auth/google/exchange":
    post:
      tags:
      - Auth
      operationId: exchangeGoogleCode
      summary: Exchange a one-time Google OAuth code for an API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  minLength: 64
                  maxLength: 64
                  example: 7O0NRml3qfMmYlZPAAHtoKz7nbz61xJkxJvQw2uoWa0CsIN1bM79G7awneA0V3a2
      responses:
        '200':
          description: Signed in successfully.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthSessionResponse"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/auth/user":
    get:
      tags:
      - Auth
      operationId: getAuthenticatedAuthUser
      summary: Get the authenticated user's profile.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResourceResponse"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
  "/api/v1/auth/logout":
    post:
      tags:
      - Auth
      operationId: logout
      summary: Revoke the current access token and web session.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Signed out.
        '401':
          "$ref": "#/components/responses/Unauthenticated"
  "/api/v1/communities":
    get:
      tags:
      - Communities
      operationId: listCommunities
      summary: List root communities with sub-communities.
      parameters:
      - "$ref": "#/components/parameters/PerPage"
      responses:
        '200':
          description: Paginated community list.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommunityCollectionResponse"
    post:
      tags:
      - Communities
      operationId: createCommunity
      summary: Create a community as an administrator.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CommunityUpsertRequest"
      responses:
        '201':
          description: Community created.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommunityResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/communities/{community}":
    get:
      tags:
      - Communities
      operationId: getCommunity
      summary: Get a community by slug.
      parameters:
      - "$ref": "#/components/parameters/CommunitySlug"
      responses:
        '200':
          description: Community detail.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommunityResourceResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
    put:
      tags:
      - Communities
      operationId: replaceCommunity
      summary: Update a community as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/CommunitySlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CommunityUpsertRequest"
      responses:
        '200':
          description: Community updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommunityResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
    patch:
      tags:
      - Communities
      operationId: updateCommunity
      summary: Partially update a community as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/CommunitySlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CommunityUpsertRequest"
      responses:
        '200':
          description: Community updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommunityResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
    delete:
      tags:
      - Communities
      operationId: deleteCommunity
      summary: Delete a community without linked children, places, or events.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/CommunitySlug"
      responses:
        '204':
          description: Community deleted.
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/api/v1/events":
    get:
      tags:
      - Events
      operationId: listEvents
      summary: List events for public and mobile clients.
      parameters:
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/PerPage"
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - upcoming
          - ongoing
          - completed
          default: all
      - name: activity
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/ActivityFilter"
      - name: community
        in: query
        required: false
        schema:
          type: string
          maxLength: 160
        example: puncak-runners
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - date
          - price
          - spots
          default: date
      responses:
        '200':
          description: Paginated event list.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventCollectionResponse"
        '422':
          "$ref": "#/components/responses/ValidationError"
    post:
      tags:
      - Events
      operationId: createEvent
      summary: Create an event as an administrator.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventUpsertRequest"
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/EventUpsertMultipartRequest"
      responses:
        '201':
          description: Event created.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/events/{event}":
    get:
      tags:
      - Events
      operationId: getEvent
      summary: Get an event by slug with ticket tiers.
      parameters:
      - "$ref": "#/components/parameters/EventSlug"
      responses:
        '200':
          description: Event detail.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResourceResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
    put:
      tags:
      - Events
      operationId: replaceEvent
      summary: Update an event as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/EventSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventUpsertRequest"
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/EventUpsertMultipartRequest"
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
    patch:
      tags:
      - Events
      operationId: updateEvent
      summary: Partially update an event as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/EventSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventUpsertRequest"
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/EventUpsertMultipartRequest"
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
    delete:
      tags:
      - Events
      operationId: deleteEvent
      summary: Delete an event with no booking history.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/EventSlug"
      responses:
        '204':
          description: Event deleted.
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/api/v1/places":
    get:
      tags:
      - Places
      operationId: listPlaces
      summary: List places for map and list views.
      parameters:
      - "$ref": "#/components/parameters/PerPage"
      - name: community
        in: query
        required: false
        schema:
          type: string
        example: puncak-menginap
      responses:
        '200':
          description: Paginated place list.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PlaceCollectionResponse"
    post:
      tags:
      - Places
      operationId: createPlace
      summary: Create a place as an administrator.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PlaceUpsertRequest"
      responses:
        '201':
          description: Place created.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PlaceResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/places/{place}":
    get:
      tags:
      - Places
      operationId: getPlace
      summary: Get a place by ID.
      parameters:
      - "$ref": "#/components/parameters/PlaceId"
      responses:
        '200':
          description: Place detail.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PlaceResourceResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
    put:
      tags:
      - Places
      operationId: replacePlace
      summary: Update a place as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/PlaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PlaceUpsertRequest"
      responses:
        '200':
          description: Place updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PlaceResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
    patch:
      tags:
      - Places
      operationId: updatePlace
      summary: Partially update a place as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/PlaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PlaceUpsertRequest"
      responses:
        '200':
          description: Place updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PlaceResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
    delete:
      tags:
      - Places
      operationId: deletePlace
      summary: Delete a place with no linked events.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/PlaceId"
      responses:
        '204':
          description: Place deleted.
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/api/v1/galleries":
    get:
      tags:
      - Galleries
      operationId: listGalleries
      summary: List gallery media.
      parameters:
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/PerPage"
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - trail-run
          - walk
          - camping
          - hike
          - wellness
          default: all
      - name: year
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - '2026'
          - '2025'
          default: all
      responses:
        '200':
          description: Paginated gallery list.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GalleryCollectionResponse"
        '422':
          "$ref": "#/components/responses/ValidationError"
    post:
      tags:
      - Galleries
      operationId: uploadGalleryPhoto
      summary: Upload a gallery photo as an administrator.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/GalleryUploadRequest"
      responses:
        '201':
          description: Gallery photo uploaded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GalleryResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/galleries/bulk-delete":
    post:
      tags:
      - Galleries
      operationId: bulkDeleteGalleryPhotos
      summary: Bulk delete gallery photos by public ID.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              properties:
                ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        '200':
          description: Delete counts returned.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BulkDeleteResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/galleries/{gallery}":
    get:
      tags:
      - Galleries
      operationId: getGallery
      summary: Get a gallery item by ID.
      parameters:
      - "$ref": "#/components/parameters/GalleryId"
      responses:
        '200':
          description: Gallery item detail.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GalleryResourceResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
    put:
      tags:
      - Galleries
      operationId: replaceGalleryPhoto
      summary: Update gallery metadata as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/GalleryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GalleryUpdateRequest"
      responses:
        '200':
          description: Gallery photo updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GalleryResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
    patch:
      tags:
      - Galleries
      operationId: updateGalleryPhoto
      summary: Partially update gallery metadata as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/GalleryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GalleryUpdateRequest"
      responses:
        '200':
          description: Gallery photo updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GalleryResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
    delete:
      tags:
      - Galleries
      operationId: deleteGalleryPhoto
      summary: Delete one gallery photo as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/GalleryId"
      responses:
        '204':
          description: Gallery photo deleted.
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/v1/galleries/{gallery}/download":
    get:
      tags:
      - Galleries
      operationId: downloadGalleryPhoto
      summary: Download a stored gallery image.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/GalleryId"
      responses:
        '200':
          description: Downloadable image file.
          headers:
            Content-Disposition:
              schema:
                type: string
        '302':
          description: Redirects to an externally hosted image path.
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/v1/contact-methods":
    get:
      tags:
      - Contact
      operationId: listContactMethods
      summary: List public contact methods.
      responses:
        '200':
          description: Contact methods.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactMethodsResponse"
  "/api/v1/contact":
    post:
      tags:
      - Contact
      operationId: createContactMessage
      summary: Submit a public contact message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ContactMessageRequest"
      responses:
        '201':
          description: Message received.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactMessageResponse"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/me":
    get:
      tags:
      - Account
      operationId: getCurrentUser
      summary: Get the authenticated user's profile.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResourceResponse"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
    patch:
      tags:
      - Account
      operationId: updateCurrentUser
      summary: Update the authenticated user's profile.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileUpdateRequest"
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResourceResponse"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/me/saved-events":
    get:
      tags:
      - Account
      operationId: listSavedEvents
      summary: List saved event cards for the authenticated user.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Saved event cards.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventCardListResponse"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
    post:
      tags:
      - Account
      operationId: saveEvent
      summary: Save an event for the authenticated user.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - eventSlug
              properties:
                eventSlug:
                  type: string
                  example: puncak-trail-run-2026
      responses:
        '200':
          description: Event was already saved.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventCardResponse"
        '201':
          description: Event saved.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventCardResponse"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/me/saved-events/{eventSlug}":
    delete:
      tags:
      - Account
      operationId: deleteSavedEvent
      summary: Remove a saved event for the authenticated user.
      security:
      - bearerAuth: []
      parameters:
      - name: eventSlug
        in: path
        required: true
        schema:
          type: string
        example: puncak-trail-run-2026
      responses:
        '204':
          description: Saved event removed.
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/v1/bookings":
    get:
      tags:
      - Bookings
      operationId: listBookings
      summary: List bookings for the authenticated user, or all bookings for administrators.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/PerPage"
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - saved
          - upcoming
          - past
          - paid
          - pending
          - cancelled
          - refunded
          default: all
      responses:
        '200':
          description: Booking list, admin rows, or saved event cards.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BookingListResponse"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
    post:
      tags:
      - Bookings
      operationId: createBooking
      summary: Create a booking and Midtrans Snap transaction.
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
        example: booking-run-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateBookingRequest"
      responses:
        '201':
          description: Booking created with a Snap token for payment.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BookingResourceResponse"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/bookings/{booking}":
    get:
      tags:
      - Bookings
      operationId: getBooking
      summary: Get one booking by database ID when allowed.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/BookingId"
      responses:
        '200':
          description: Booking detail.
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/BookingResourceResponse"
                - "$ref": "#/components/schemas/AdminBookingResponse"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/v1/bookings/{bookingReference}/cancel":
    post:
      tags:
      - Bookings
      operationId: cancelBooking
      summary: Cancel an owned booking by reference at least 24 hours before event
        start.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/BookingReference"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Cannot attend
      responses:
        '200':
          description: Booking cancelled.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BookingStatusResponse"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/api/v1/bookings/{bookingReference}/payment-status/sync":
    post:
      tags:
      - Bookings
      operationId: syncBookingPaymentStatus
      summary: Sync a booking payment status from Midtrans.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/BookingReference"
      responses:
        '200':
          description: Payment status synced.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentStatusResponse"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/api/v1/bookings/{bookingReference}/ticket":
    get:
      tags:
      - Bookings
      operationId: downloadBookingTicket
      summary: Download a paid booking ticket HTML document.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/BookingReference"
      responses:
        '200':
          description: Downloadable ticket document.
          content:
            text/html:
              schema:
                type: string
          headers:
            Content-Disposition:
              schema:
                type: string
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/api/v1/bookings/{bookingReference}/refund":
    post:
      tags:
      - Bookings
      operationId: refundBooking
      summary: Refund a confirmed or completed booking as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/BookingReference"
      responses:
        '200':
          description: Booking refunded or already refunded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BookingStatusMessageResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/api/v1/bookings/{bookingReference}/resend-receipt":
    post:
      tags:
      - Bookings
      operationId: resendBookingReceipt
      summary: Resend a booking receipt email as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/BookingReference"
      responses:
        '200':
          description: Receipt email sent.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReceiptResentResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/api/v1/bookings/{bookingReference}/payment-status":
    patch:
      tags:
      - Bookings
      operationId: updateBookingPaymentStatus
      summary: Update booking payment state as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/BookingReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - payment_status
              properties:
                payment_status:
                  "$ref": "#/components/schemas/PaymentStatus"
      responses:
        '200':
          description: Payment status updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentStatusResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/payments/midtrans/notification":
    post:
      tags:
      - Payments
      operationId: handleMidtransPaymentNotification
      summary: Receive Midtrans Snap payment notification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MidtransNotificationRequest"
      responses:
        '200':
          description: Notification accepted and booking payment state updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentStatusMessageResponse"
        '403':
          description: Invalid Midtrans signature.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/api/v1/admin/dashboard":
    get:
      tags:
      - Admin
      operationId: getAdminDashboard
      summary: Get administrative dashboard metrics.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Dashboard metrics.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminDashboardResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/v1/members":
    get:
      tags:
      - Admin
      operationId: listMembers
      summary: List members as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/PerPage"
      responses:
        '200':
          description: Paginated member list.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserCollectionResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
    post:
      tags:
      - Admin
      operationId: createMember
      summary: Create a member as an administrator.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MemberCreateRequest"
      responses:
        '201':
          description: Member created.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/members/{member}":
    get:
      tags:
      - Admin
      operationId: getMember
      summary: Get a member as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/MemberId"
      responses:
        '200':
          description: Member detail.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
    put:
      tags:
      - Admin
      operationId: replaceMember
      summary: Update a member as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MemberUpdateRequest"
      responses:
        '200':
          description: Member updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
    patch:
      tags:
      - Admin
      operationId: updateMember
      summary: Partially update a member as an administrator.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MemberUpdateRequest"
      responses:
        '200':
          description: Member updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResourceResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
    delete:
      tags:
      - Admin
      operationId: deleteMember
      summary: Delete a member while ensuring at least one admin remains.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/MemberId"
      responses:
        '204':
          description: Member deleted.
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 15
    CommunitySlug:
      name: community
      in: path
      required: true
      schema:
        type: string
      example: puncak-runners
    EventSlug:
      name: event
      in: path
      required: true
      schema:
        type: string
      example: puncak-trail-run-2026
    PlaceId:
      name: place
      in: path
      required: true
      schema:
        type: integer
      example: 1
    GalleryId:
      name: gallery
      in: path
      required: true
      schema:
        type: integer
      example: 1
    BookingId:
      name: booking
      in: path
      required: true
      schema:
        type: integer
      example: 1
    BookingReference:
      name: bookingReference
      in: path
      required: true
      schema:
        type: string
      example: PTR-26-8F3K2A
    MemberId:
      name: member
      in: path
      required: true
      schema:
        type: integer
      example: 1
  responses:
    Unauthenticated:
      description: The request is missing valid authentication.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            message: Unauthenticated.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            message: Not Found
    Forbidden:
      description: Administrator access is required or the user may not access this
        resource.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            message: Unauthorized. Administrator access required.
    Conflict:
      description: The request conflicts with the current resource state.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ValidationErrorResponse"
  schemas:
    Activity:
      type: string
      enum:
      - trail-run
      - walk
      - camping
      - hike
      - wellness
      - fun-run
    ActivityFilter:
      type: string
      enum:
      - all
      - trail-run
      - walk
      - camping
      - hike
      - wellness
      - fun-run
      default: all
    BookingStatus:
      type: string
      enum:
      - pending
      - confirmed
      - cancelled
      - completed
      - refunded
    PaymentStatus:
      type: string
      enum:
      - pending
      - paid
      - failed
      - refunded
    PublicationStatus:
      type: string
      enum:
      - draft
      - published
      - archived
    UserRole:
      type: string
      enum:
      - member
      - admin
    UserStatus:
      type: string
      enum:
      - active
      - inactive
    ErrorResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ValidationErrorResponse:
      type: object
      required:
      - message
      - errors
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    HealthResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - status
          - service
          properties:
            status:
              type: string
              example: ok
            service:
              type: string
              example: Puncak Traveller
    SimpleMeta:
      type: object
      required:
      - page
      - perPage
      - total
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    LaravelPaginationLinks:
      type: object
      properties:
        first:
          type: string
          format: uri
          nullable: true
        last:
          type: string
          format: uri
          nullable: true
        prev:
          type: string
          format: uri
          nullable: true
        next:
          type: string
          format: uri
          nullable: true
    LaravelPaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        links:
          type: array
          items:
            type: object
            additionalProperties: true
        path:
          type: string
        per_page:
          type: integer
        to:
          type: integer
          nullable: true
        total:
          type: integer
    LaravelPaginatedResponse:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          type: array
          items: {}
        links:
          "$ref": "#/components/schemas/LaravelPaginationLinks"
        meta:
          "$ref": "#/components/schemas/LaravelPaginationMeta"
    LandingResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - hero_stats
          - upcoming_events
          - activities
          - live_event
          - communities
          - gallery
          properties:
            hero_stats:
              type: array
              items:
                "$ref": "#/components/schemas/LandingStat"
            upcoming_events:
              type: array
              items:
                "$ref": "#/components/schemas/Event"
            activities:
              type: array
              items:
                "$ref": "#/components/schemas/LandingActivity"
            live_event:
              anyOf:
              - "$ref": "#/components/schemas/Event"
            communities:
              type: array
              items:
                "$ref": "#/components/schemas/Community"
            gallery:
              type: array
              items:
                "$ref": "#/components/schemas/Gallery"
    LandingStat:
      type: object
      required:
      - label
      - value
      properties:
        label:
          type: string
          example: Active members
        value:
          type: integer
          minimum: 0
    LandingActivity:
      type: object
      required:
      - activity_type
      - activity_label
      - upcoming_count
      properties:
        activity_type:
          "$ref": "#/components/schemas/Activity"
        activity_label:
          type: string
          example: Trail Run
        upcoming_count:
          type: integer
          minimum: 0
    Community:
      type: object
      required:
      - id
      - parent_id
      - name
      - slug
      - description
      - image_path
      - image_url
      - member_count
      - places_count
      - events_count
      - placesCount
      - eventsCount
      properties:
        id:
          type: integer
        parent_id:
          type: integer
          nullable: true
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        image_path:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        member_count:
          type: integer
          minimum: 0
        places_count:
          type: integer
          minimum: 0
        events_count:
          type: integer
          minimum: 0
        placesCount:
          type: integer
          minimum: 0
        eventsCount:
          type: integer
          minimum: 0
        children:
          type: array
          items:
            "$ref": "#/components/schemas/Community"
    CommunityResourceResponse:
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/Community"
    CommunityCollectionResponse:
      allOf:
      - "$ref": "#/components/schemas/LaravelPaginatedResponse"
      - type: object
        properties:
          data:
            type: array
            items:
              "$ref": "#/components/schemas/Community"
    CommunityUpsertRequest:
      type: object
      properties:
        parent_id:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 140
        slug:
          type: string
          maxLength: 160
          nullable: true
        description:
          type: string
          maxLength: 10000
          nullable: true
        image_path:
          type: string
          maxLength: 255
          nullable: true
        member_count:
          type: integer
          minimum: 0
    Place:
      type: object
      required:
      - id
      - community_id
      - name
      - lat
      - lng
      - description
      - image_path
      - imageUrl
      - image_url
      - imageAlt
      properties:
        id:
          type: integer
        community_id:
          type: integer
        name:
          type: string
        lat:
          type: number
          format: float
        lng:
          type: number
          format: float
        description:
          type: string
          nullable: true
        image_path:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        imageAlt:
          type: string
          nullable: true
        community:
          anyOf:
          - "$ref": "#/components/schemas/Community"
    PlaceResourceResponse:
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/Place"
    PlaceCollectionResponse:
      allOf:
      - "$ref": "#/components/schemas/LaravelPaginatedResponse"
      - type: object
        properties:
          data:
            type: array
            items:
              "$ref": "#/components/schemas/Place"
    PlaceUpsertRequest:
      type: object
      properties:
        community_id:
          type: integer
        community_slug:
          type: string
          nullable: true
        name:
          type: string
          maxLength: 160
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        description:
          type: string
          maxLength: 10000
          nullable: true
    TicketType:
      type: object
      required:
      - id
      - eventId
      - name
      - description
      - price
      - currency
      - stock
      - quantity
      - sold
      - capacityLabel
      properties:
        id:
          type: string
        eventId:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: integer
          minimum: 0
        currency:
          type: string
          example: IDR
        stock:
          type: integer
          minimum: 0
        quantity:
          type: integer
          minimum: 0
        sold:
          type: integer
          minimum: 0
        capacityLabel:
          type: string
        maxPerUser:
          type: integer
          minimum: 1
    Event:
      type: object
      required:
      - id
      - slug
      - title
      - category
      - activity
      - status
      - statusLabel
      - publicationStatus
      - startsAt
      - endsAt
      - location
      - priceFrom
      - imageUrl
      - imageAlt
      - tickets
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        category:
          type: string
        activity:
          "$ref": "#/components/schemas/Activity"
        status:
          type: string
          enum:
          - upcoming
          - ongoing
          - completed
        statusLabel:
          type: string
        publicationStatus:
          "$ref": "#/components/schemas/PublicationStatus"
        publicationStatusLabel:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        dateLabel:
          type: string
        fullDateLabel:
          type: string
        timeLabel:
          type: string
        location:
          type: string
        region:
          type: string
        priceFrom:
          type: integer
          minimum: 0
        priceLabel:
          type: string
        spotsRemaining:
          type: integer
          minimum: 0
        spotsLabel:
          type: string
        imageUrl:
          type: string
          nullable: true
        imageAlt:
          type: string
        detailHref:
          type: string
        bookingHref:
          type: string
        recapHref:
          type: string
        organiser:
          type: object
